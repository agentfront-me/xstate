# Inside the server { } block of /etc/nginx/conf.d/stalwart-xstateio.conf (mx.xstate.io, port 443): lets the API
# reach the scan service at https://mx.xstate.io/_scan/. Every call needs the SCAN_SECRET; /hook is for Stalwart
# on localhost only.
location /_scan/ {
    proxy_pass http://127.0.0.1:8765/;
    client_max_body_size 110m;
    proxy_request_buffering off;
    proxy_read_timeout 180s;
}
location = /_scan/hook { return 404; }

# Appended to /etc/clamd.d/scan.conf: the settings xstate needs on top of the package's file, which already
# has LogSyslog and User.
LocalSocket /run/clamd.scan/clamd.sock
LocalSocketGroup virusgroup
LocalSocketMode 660

# A whole email or an upload arrives as one stream: mail is at most ~50 MB, Storage uploads 100 MB.
StreamMaxLength 120M
MaxFileSize 120M
MaxScanSize 400M

# Reload signatures in place instead of loading a second copy next to the first. Scans wait a few seconds during a
# reload (a few times a day), which halves the memory ClamAV needs.
ConcurrentDatabaseReload no

# Phishing and scam signatures. Leave on; watch the log-only week for false alarms.
PhishingSignatures yes

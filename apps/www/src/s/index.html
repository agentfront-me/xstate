<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shared file · xstate</title>
<!-- Shared links stay out of search engines, and the page sends no Referer to sites linked from a file. -->
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<script>
  try {
    var t = localStorage.getItem('theme');
    if (t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark');
  } catch (e) {}
</script>
<script type="module" src="../storage/PublicPage.tsx"></script>
</head>
<body>
<div id="root"></div>
</body>
</html>
